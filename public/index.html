<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRCS Community Health</title><link rel="stylesheet" href="/style.css"></head><body><div id="setup" class="center card" hidden><img class="brand-logo" src="/prcs-logo.jpg" alt="شعار الهلال الأحمر الفلسطيني"><h1>تهيئة النظام</h1><p>مرحباً بك. أكمل البيانات التالية لبدء استخدام النظام.</p><input id="org" value="جمعية الهلال الأحمر الفلسطيني" placeholder="اسم الجهة"><input id="sys" value="نظام الصحة المجتمعية" placeholder="اسم النظام"><input id="center" placeholder="المركز الأول (اختياري)"><hr><h3>مدير النظام</h3><input id="adminName" placeholder="الاسم الكامل"><input id="adminUser" placeholder="اسم المستخدم"><input id="adminPass" type="password" placeholder="كلمة المرور - 8 أحرف على الأقل"><button onclick="finishSetup()">إنهاء التهيئة وبدء النظام</button><small id="setupErr"></small></div><div id="login" class="center card" hidden><img class="brand-logo" src="/prcs-logo.jpg" alt="شعار الهلال الأحمر الفلسطيني"><h1>الهلال الأحمر الفلسطيني</h1><p>نظام الصحة المجتمعية</p><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><small id="err"></small></div><div id="app" hidden><aside><div class="brand"><img src="/prcs-logo.jpg" alt="PRCS"><div><h2>الهلال الأحمر الفلسطيني</h2><b>الصحة المجتمعية</b></div></div><nav><button onclick="view('dashboard')">لوحة التحكم</button><button onclick="view('services')">الخدمات</button><button onclick="view('forms')">منشئ النماذج</button><button onclick="view('beneficiaries')">المستفيدون</button><button onclick="view('tasks')">المهام والإحالات</button><button onclick="view('reports')">التقارير</button><button onclick="view('settings')">الإعدادات</button></nav></aside><main><header><h1 id="title">لوحة التحكم</h1><button onclick="logout()">تسجيل الخروج</button></header><section id="content"></section></main></div><script src="/app.js"></script></body></html>
