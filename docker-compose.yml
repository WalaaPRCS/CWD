services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["3000:3000"]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prcs_cwd
      POSTGRES_USER: prcs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [prcs_cwd_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U prcs -d prcs_cwd"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  prcs_cwd_data: