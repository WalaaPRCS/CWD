services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prcs_cwd
      POSTGRES_USER: prcs
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - prcs_cwd_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prcs -d prcs_cwd"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://prcs@postgres:5432/prcs_cwd
      JWT_SECRET: local-container-session-key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  prcs_cwd_data:
